{% extends 'user_index.html' %}
{% block h2 %}
<i class="bi bi-layout-text-sidebar"></i> {{ title }}
{% endblock %}

{% block content %}



<div class="card mt-">
  <h5 class="card-header">Поиск КТП</h5>
  <div class="card-body">
   <form class="needs-validation" novalidate method="get">
  <div class="form-row">
    <div class="col-md-4 mb-3">
      <label for="validationCustom01">Класс</label>
      <select name="" id="">
        {% for i in classes %}
        <option value="">{{ i }}</option>
        {% endfor %}
      </select>
      <div class="valid-feedback">
        Looks good!
      </div>
    </div>
    <div class="col-md-4 mb-3">
      <label for="validationCustom02">Предмет</label>

      <select name="" id="">
          {% for i in subjects %}
            <option value="">{{ i }}</option>
          {% endfor %} 
      </select>
      <div class="valid-feedback">
        Looks good!
      </div>
    </div>
    <div class="col-md-4 mb-3">
      <label for="validationCustomUsername">Автор</label>
      <div class="input-group">

          <select name="" id="">
            <option value="">Все</option>
            {% for i in teachers %}
            <option value="">{{ i }}</option>
            {% endfor%}
          </select>
        
      </div>
    </div>
  </div>


  <button class="btn btn-secondary" type="submit"><i class="fa fa-search"></i> Показать</button>
</form>

  </div>
</div>

<div class="mt-3">

<!-- Button trigger modal -->
<button type="button" class="btn btn-primary" data-toggle="modal" data-target="#exampleModal">
  Добавить новое
</button>

<!-- Modal -->
<div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-light">
        <h5 class="modal-title" id="exampleModalLabel">Modal title</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        ...
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
        <button type="button" class="btn btn-primary">Save changes</button>
      </div>
    </div>
  </div>
</div>

</div>

{% endblock %}
