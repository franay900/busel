    <!-- Latest compiled and minified JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap-select@1.13.14/dist/js/bootstrap-select.min.js"></script>

    <script type="text/javascript" src="{% static 'js/user.js'%}"></script>

    <script type="text/javascript" src="{% static 'js/journal.js'%}"></script>

    <link rel="stylesheet" type="text/css" href="{% static 'css/main.css'%}">
    <link rel="stylesheet" type="text/css" href="{% static 'css/journal.css'%}">
    

    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">



    <title>{%block title%}{{ title }}{% endblock %}</title>
  </head>
  <body>

    {% include 'inc/nav_user.html' %}
    <div class="container mt-3 ">
      <h4 class="">{% block h2 %}{{ title }}{% endblock %}</h4>
      <div class="row">
       <div class="col-md-12">
         {% if messages %}
         {% for message in messages %}





          <div class="alert alert-primary" role="alert">
          {{ message }}
        </div>
       

            
          {% endfor %}
          {% endif %}

         {% block content %}
         Content
         {% endblock %}
       </div>
      </div>
    </div>

<footer class="py-3 my-4">
    <hr>
    <p class="text-center text-muted">© 2020-2022 ПК "Бусел"</p>
  </footer>
