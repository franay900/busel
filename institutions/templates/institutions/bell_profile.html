{% extends 'user_index.html' %}
{% block h2 %}
<i class="bi bi-bell"></i> Профили звонков
{% endblock %}


{% block content %}
		<div class="row">
		<div class="col-3">
		<table class="table table-bordered table-sm table-hover ">
			<thead class="bg-info text-white">
				<tr>
					<th>№</th>
					<th>
						Наименование
					</th>

				</tr>

			</thead>
			{% for bell_profile in bell_profiles %}
			<tr>
				<td class="text-center">{{ forloop.counter }}</td>
				<td>{{ bell_profile.title }}</td>

			</tr>
			{% endfor %}
		</table>
	</div>
	</div>
	<a class="btn btn-info" href="{% url 'Bell_profile_create' %}"><i class="bi bi-folder-plus"></i> Добавить</a>
   
{% endblock %}
