{% extends 'user_index.html' %}
{% block h2 %}
Расписание
{% endblock %}


{% block content %}
	<table class="table table-sm table-bordered">
		<tr>
			<td>Класс</td>
			<td>Профиль учебных периодов</td>
			<td colspan="3">Действие</td>
		</tr>
		{% for i in classes %}
		<tr>
			<td>{{ i.class_number }}{{ i.letter }}</td>
			<td>{{ i.period_profile }}</td>
			<td><a href="{{ i.timetable_templates }}">Шаблоны</a></td>
			<td><a href="{{ i.timetable_weeks }}">Распределение уроков</a></td>
			<td><a href="">Редактирование уроков</a></td>
		</tr>
		{% endfor %}
	</table>
{% endblock %}
