{% extends 'user_index.html' %}



{% block content %}
   <table class="table table-bordered table-sm ">
    <thead class="thead-light">
     <tr>
    	<th>№</th>
       <th>ФИО</th>
       <th>Класс</th>
       <th colspan="2">Действие</th>       
     </tr>
     </thead>
     	{% for i in users %}
     	<tr>
     		<td>{{ forloop.counter }}</td>
     		<td>{{ i.user.last_name  }}  {{ i.user.first_name }} {{ i.user.middle_name }}</td>

        <td>{{ i.class_pk }}</td>
     		<td><a href="{{ i.get_absolute_url }}">Редактировать</a></td>
     		<td><a href="{{ i.ban }}">Заблокировать</a></td>
     	</tr>
     	{% endfor %}
   </table>
   <a class="btn btn-success" href="{% url 'StudentAdd' %}">Добавить</a>
   <a class="btn btn-danger" href="{% url 'StudentImport' %}">Импорт</a>
{% endblock %}
